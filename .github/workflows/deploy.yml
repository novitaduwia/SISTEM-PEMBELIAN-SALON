name: Deploy Salon to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir site
          cp -r FRONT-END/. site/

          mkdir -p site/BACK-END
          cp BACK-END/app.js site/BACK-END/app.js

          sed -i 's#../BACK-END/app.js#BACK-END/app.js#g' site/index.html

          touch site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
